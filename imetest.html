<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>IME 입력 진단 v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Serif KR', serif; background: #f3efe8; color: #1a1a1a;
      max-width: 480px; margin: 0 auto; padding: 20px 16px 120px; touch-action: pan-x pan-y; }
    h1 { font-size: 18px; margin-bottom: 6px; }
    p.desc { font-size: 12px; color: #666; margin-bottom: 18px; line-height: 1.7; }
    .case { background: #fff; border: 1px solid #e2d9c8; border-radius: 12px; padding: 14px; margin-bottom: 14px; }
    .case b { display: block; font-size: 13px; margin-bottom: 8px; color: #b4925a; }
    .fstyle { width: 100%; padding: 14px 16px; background: #fff; border: 1px solid rgba(180,146,90,.3);
      border-radius: 14px; font-family: 'Noto Serif KR', serif; font-size: 14px; color: #1a1a1a;
      font-weight: 300; outline: none; -webkit-appearance: none; appearance: none; }
    .plain { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; }
    .btn { width: 100%; padding: 14px; background: #1a1a1a; color: #fff; border: none; border-radius: 12px; font-size: 15px; }
    .ov { position: fixed; inset: 0; background: rgba(26,26,26,.86); z-index: 900;
      display: none; align-items: flex-end; justify-content: center; }
    .ov.open { display: flex; }
    .sh { background: #f7f4ee; border-radius: 24px 24px 0 0; padding: 28px; width: 100%;
      max-width: 480px; max-height: 92svh; overflow-y: auto; position: relative; touch-action: pan-y; }
    .close { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 18px; }
    .cd { text-align: center; font-size: 30px; letter-spacing: 2px; margin: 10px 0 16px; color: #b4925a; }
    .lbl { font-size: 12px; color: #b4925a; margin: 12px 0 6px; }
  </style>
</head>
<body>
  <h1>한글 입력 진단 v2</h1>
  <p class="desc">각 팝업을 열고 입력칸에 <b>“안녕”</b> 을 쳐 보세요.<br>
    <b>E</b>=팝업+1초마다 화면갱신(리플로우), <b>F</b>=팝업+스와이프닫기 핸들러.<br>
    어느 것이 되고 안 되는지 알려주세요.</p>

  <div class="case"><b>A. 기본 입력(기준)</b><input class="plain" placeholder="'안녕'" /></div>
  <div class="case"><b>C. 팝업만 (지난번 정상)</b><button class="btn" onclick="openC()">C 열기</button></div>
  <div class="case"><b>E. 팝업 + 1초마다 리플로우(카운트다운 모사)</b><button class="btn" onclick="openE()">E 열기</button></div>
  <div class="case"><b>F. 팝업 + 스와이프닫기 터치핸들러</b><button class="btn" onclick="openF()">F 열기</button></div>

  <!-- C -->
  <div class="ov" id="ovC"><div class="sh">
    <button class="close" onclick="closeAll()">✕</button>
    <div class="lbl">성함 *</div><input class="fstyle" placeholder="'안녕'" />
    <div style="height:500px"></div>
  </div></div>

  <!-- E: 1초마다 textContent 갱신(리플로우) -->
  <div class="ov" id="ovE"><div class="sh">
    <button class="close" onclick="closeAll()">✕</button>
    <div class="cd" id="cdE">--:--:--</div>
    <div class="lbl">성함 *</div><input class="fstyle" placeholder="'안녕'" />
    <div style="height:500px"></div>
  </div></div>

  <!-- F: 스와이프 핸들러가 붙은 시트 -->
  <div class="ov" id="ovF"><div class="sh" id="shF">
    <button class="close" onclick="closeAll()">✕</button>
    <div class="lbl">성함 *</div><input class="fstyle" placeholder="'안녕'" />
    <div style="height:500px"></div>
  </div></div>

  <script>
    'use strict';
    document.addEventListener('touchstart', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
    document.addEventListener('touchend', function (e) { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

    let cdTimer = null;
    function open(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeAll() {
      ['ovC','ovE','ovF'].forEach(i => document.getElementById(i).classList.remove('open'));
      document.body.style.overflow = '';
      if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
    }
    function openC() { open('ovC'); }
    function openE() {
      open('ovE');
      // 실제 카운트다운처럼 1초마다 textContent 갱신 → 리플로우 유발 (정지 안 함)
      const el = document.getElementById('cdE');
      cdTimer = setInterval(function () {
        const n = new Date();
        el.textContent = n.getHours() + ':' + String(n.getMinutes()).padStart(2,'0') + ':' + String(n.getSeconds()).padStart(2,'0');
      }, 1000);
    }
    function openF() {
      open('ovF');
      setupSwipe();
    }
    let swipeReady = false;
    function setupSwipe() {
      if (swipeReady) return; swipeReady = true;
      const sheet = document.getElementById('shF');
      let startY = 0, currentY = 0, dragging = false;
      sheet.addEventListener('touchstart', function (e) {
        if (e.target.closest && e.target.closest('input, textarea, button')) { dragging = false; return; }
        startY = e.touches[0].clientY; dragging = true; sheet.style.transition = 'none';
      }, { passive: true });
      sheet.addEventListener('touchmove', function (e) {
        if (!dragging) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 6 && sheet.scrollTop <= 0) { e.preventDefault(); currentY = dy; sheet.style.transform = 'translateY(' + dy + 'px)'; }
      }, { passive: false });
      sheet.addEventListener('touchend', function () { dragging = false; sheet.style.transform = ''; currentY = 0; });
    }
  </script>
</body>
</html>
